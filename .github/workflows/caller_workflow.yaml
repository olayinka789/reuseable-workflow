name: Main CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  run-security-checks:
    # Syntax for a central public or internal repository:
    # uses: <organization>/<repo>/.github/workflows/reusable-security-scan.yml@main
    
    # Syntax for a local file within the same repository:
    uses: ./.github/workflows/reusable.yml@v1
    
    with:
      node-version: '20.x'
    secrets:
      api-token: ${{ secrets.MY_GLOBAL_SECRET }}
