name: Main Pipeline
on: push

jobs:
  call-reusable:
    uses: my-org/shared-workflows/.github/workflows/ci.yml@v1
    with:
      node-version: '20'
    secrets:
      # Pass specific secrets by name
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      
      # Or pass all available secrets implicitly
      # secrets: inherit   