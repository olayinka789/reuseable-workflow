name: Main Pipeline
on: push

jobs:
  call-reusable:
    uses: ./.github/workflows/secrets-usable.yaml
    with:
      node-version: '20'
    secrets:
      # Pass specific secrets by name
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      
      # Or pass all available secrets implicitly
      # secrets: inherit   