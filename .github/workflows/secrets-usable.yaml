name: Reusable CI
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '20'
    secrets:
      NPM_TOKEN:
        required: true
      DEPLOY_KEY:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install locked dependencies
        if: hashFiles('package-lock.json', 'npm-shrinkwrap.json') != ''
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install dependencies
        if: hashFiles('package-lock.json', 'npm-shrinkwrap.json') == '' && hashFiles('package.json') != ''
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}   